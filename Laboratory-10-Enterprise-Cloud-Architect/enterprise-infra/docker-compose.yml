# Two-tier application stack: WordPress (web tier) + MariaDB (data tier)
# Deploy:  cp .env.example .env  (edit passwords)  &&  docker compose up -d
#
# Design notes
#  - Only the web container publishes a port (80). The database has NO published
#    ports, so it is unreachable from outside the Docker network.
#  - The "backend" network is internal: the database cannot reach the internet.
#  - Named volumes persist data across container recreation and VM reboots.
#  - Memory limits keep the stack safe on a small (2-3 GB) VM.

services:
  db:
    image: mariadb:11.4
    container_name: ent_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    image: wordpress:6-apache
    container_name: ent_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      # Bound to the host-only IP (set BIND_IP in .env). Because Docker can bypass
      # UFW for published ports, binding to one address keeps the site off the NAT adapter.
      - "${BIND_IP:-127.0.0.1}:80:80"
    volumes:
      - wp_data:/var/www/html
    networks:
      - frontend
      - backend
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
    name: ent_db_data
  wp_data:
    name: ent_wp_data

networks:
  frontend:
    name: ent_frontend
  backend:
    name: ent_backend
    internal: true
